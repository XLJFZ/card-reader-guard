name: Windows build and safety checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable application
        shell: pwsh
        run: ./build.ps1
      - name: Check idle and binding logic without ejecting hardware
        shell: pwsh
        run: ./test.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: CardReaderGuard-win-x64
          path: |
            CardReaderGuard-v*-win-x64.zip
            dist/CardReaderGuard.exe
          if-no-files-found: error
          retention-days: 14
