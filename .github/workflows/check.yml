name: Windows build and safety checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable application
        shell: pwsh
        run: ./build.ps1
      - name: Build Windows installer
        shell: pwsh
        run: |
          $assembly = [regex]::Match((Get-Content -LiteralPath '.\AssemblyInfo.cs' -Raw), 'AssemblyFileVersion\("([\d.]+)"\)').Groups[1].Value
          $installer = [regex]::Match((Get-Content -LiteralPath '.\installer\CardReaderGuard.iss' -Raw), 'AppVersion "([\d.]+)"').Groups[1].Value
          $assemblyShort = ($assembly -split '\.')[0..2] -join '.'
          if ($assemblyShort -ne $installer) { throw "Installer version $installer does not match assembly version $assemblyShort." }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { choco install innosetup --no-progress -y }
          if (!(Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc 'installer\CardReaderGuard.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CardReaderGuard-installer
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Check idle and binding logic without ejecting hardware
        shell: pwsh
        run: ./test.ps1
      - name: Write release checksums
        shell: pwsh
        run: |
          $assembly = [regex]::Match((Get-Content -LiteralPath '.\AssemblyInfo.cs' -Raw), 'AssemblyFileVersion\("([\d.]+)"\)').Groups[1].Value
          $short = ($assembly -split '\.')[0..2] -join '.'
          $standalone = "CardReaderGuard-standalone-$short.exe"
          Copy-Item -LiteralPath 'dist\CardReaderGuard.exe' -Destination $standalone -Force
          $files = @()
          $files += Get-ChildItem -Path . -Filter 'CardReaderGuard-v*-win-x64.zip' -File
          $files += Get-Item -LiteralPath $standalone
          $files += Get-ChildItem -Path 'installer\output\*.exe' -File
          if (@($files).Count -lt 3) { throw "Expected the portable zip, the standalone executable and the installer; found $(@($files).Count)." }
          $lines = $files | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'SHA256SUMS.txt'), $lines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content -LiteralPath 'SHA256SUMS.txt'
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: CardReaderGuard-win-x64
          path: |
            CardReaderGuard-v*-win-x64.zip
            dist/CardReaderGuard.exe
            CardReaderGuard-standalone-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload release checksums
        uses: actions/upload-artifact@v4
        with:
          name: CardReaderGuard-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
