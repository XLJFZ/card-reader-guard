name: Windows build and safety checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable application
        shell: pwsh
        run: ./build.ps1
      - name: Build Windows installer
        shell: pwsh
        run: |
          $assembly = [regex]::Match((Get-Content -LiteralPath '.\AssemblyInfo.cs' -Raw), 'AssemblyFileVersion\("([\d.]+)"\)').Groups[1].Value
          $installer = [regex]::Match((Get-Content -LiteralPath '.\installer\CardReaderGuard.iss' -Raw), 'AppVersion "([\d.]+)"').Groups[1].Value
          if ($assembly -ne $installer) { throw "Installer version $installer does not match assembly version $assembly." }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { choco install innosetup --no-progress -y }
          if (!(Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc 'installer\CardReaderGuard.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CardReaderGuard-installer
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Check idle and binding logic without ejecting hardware
        shell: pwsh
        run: ./test.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: CardReaderGuard-win-x64
          path: CardReaderGuard-v*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
